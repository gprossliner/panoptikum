# A minimal backend "app" for the smoke test: plain nginx:alpine, no
# custom image build. Rather than serving static files (which would need
# to understand AppRegistration's pathPrefix sub-path serving itself), it
# uses nginx's `return` directive with variable interpolation to echo back
# what it received, as plain text - good enough to prove the reverse
# proxy's no-path-rewriting and trusted-header-injection behavior without
# any application logic of its own (see docs/ARCHITECTURE.md "Smoke Testing").
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-nginx-conf
data:
  default.conf: |
    server {
      listen 8080;

      location / {
        default_type text/plain;
        return 200 "sample-app\nmethod: $request_method\nrequest_uri: $request_uri\nX-Forwarded-User: $http_x_forwarded_user\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app.kubernetes.io/name: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Unprivileged variant (listens on 8080, not 80) - stock nginx:alpine
        # needs root to write its default cache/pid/log paths, which
        # `restricted` Pod Security disallows.
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: sample-app-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
spec:
  selector:
    app.kubernetes.io/name: sample-app
  ports:
    - name: http
      port: 80
      targetPort: http
