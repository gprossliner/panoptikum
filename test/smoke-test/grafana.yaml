# A second, more realistic example app for the smoke test: real Grafana,
# no PVC (ephemeral sqlite in the container's own writable layer - data
# lost on pod restart, fine for a demo), no Ingress or ConfigMap of its
# own. All sub-path/trusted-header config is via env vars (GF_* config
# overrides, see docs/ARCHITECTURE.md "Smoke Testing"). Registered under
# AppRegistration pathPrefix "/grafana/" (panoptikum.yaml), which the
# portal-server's reverse proxy forwards unmodified - no path rewriting,
# see internal/appproxy/appproxy.go - so Grafana itself must know it's
# served from that sub-path (root_url/serve_from_sub_path below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana-oss:13.0.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            # root_url is a literal external URL, not %(protocol)s/
            # %(domain)s placeholders: those reflect Grafana's own
            # listener config (server.protocol), and setting that to
            # https would make Grafana expect its own TLS cert/key, which
            # we don't have - TLS terminates at the Ingress, Grafana
            # itself only ever speaks plain HTTP. A literal https root_url
            # also fixes Grafana Live's websocket handshake, which
            # otherwise rejects the browser's Origin header with a 403
            # (derived appUrl wouldn't match).
            - name: GF_SERVER_ROOT_URL
              value: https://portal.127.0.0.1.nip.io/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            # Trusts the X-Forwarded-User header injected by
            # panoptikum's reverse proxy (AppAuthentication "grafana"
            # below) instead of Grafana's own login form - safe here only
            # because the Service below has no Ingress of its own and is
            # reachable solely through the portal-server, which always
            # sets this header to the authenticated user (never
            # forwarding a client-supplied one, see
            # internal/appproxy/appproxy.go).
            - name: GF_AUTH_PROXY_ENABLED
              value: "true"
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: X-Forwarded-User
            - name: GF_AUTH_PROXY_HEADER_PROPERTY
              value: username
            - name: GF_AUTH_PROXY_AUTO_SIGN_UP
              value: "true"
            # Portal is already the access boundary (only alice/bob can log
            # in at all via nanoidp) - give every auto-signed-up user full
            # Grafana access (Admin) rather than Grafana's own default
            # (Viewer), same as the predecessor management-portal's
            # grafana.tf. Viewer can't create "Share externally" public
            # dashboards, needed to exercise issue #11's anonymous routes.
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            # No GF_SECURITY_ALLOW_EMBEDDING needed: the portal's reverse
            # proxy rewrites Grafana's default X-Frame-Options: deny to
            # SAMEORIGIN automatically (see internal/appproxy/appproxy.go).
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: http
