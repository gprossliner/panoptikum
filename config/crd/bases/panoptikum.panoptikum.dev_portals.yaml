---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: portals.panoptikum.panoptikum.dev
spec:
  group: panoptikum.panoptikum.dev
  names:
    kind: Portal
    listKind: PortalList
    plural: portals
    singular: portal
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Portal is the Schema for the portals API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Portal
            properties:
              allowedAppNamespaces:
                default: .+
                description: |-
                  allowedAppNamespaces is a regex (RE2), anchored and matched against an
                  AppRegistration's namespace to decide whether it may bind to this
                  Portal (see docs/ARCHITECTURE.md Decision 8). Defaults to ".+" (any namespace).
                type: string
              customization:
                description: customization configures optional cosmetic branding of
                  the portal shell.
                properties:
                  accentColor:
                    description: accentColor sets the active nav link / highlight
                      color.
                    type: string
                  backgroundColor:
                    description: backgroundColor sets the header background, e.g.
                      "#303030".
                    type: string
                  faviconURL:
                    description: faviconURL is rendered as a <link href>.
                    type: string
                  logoURL:
                    description: logoURL is rendered as an <img src> in the portal
                      header.
                    type: string
                type: object
              displayName:
                description: displayName is shown in the portal shell header. Defaults
                  to metadata.name when omitted.
                type: string
              host:
                description: |-
                  host is the externally-visible hostname, used for the OIDC redirect
                  URI even if ingress.enabled is false and the user fronts it themselves.
                type: string
              ingress:
                description: ingress configures whether/how this Portal creates its
                  own Ingress.
                properties:
                  enabled:
                    description: |-
                      enabled selects whether an Ingress is created for this Portal. When
                      false, no Ingress is created and the user provides their own routing.
                    type: boolean
                  ingressClassName:
                    description: ingressClassName selects the IngressClass to use.
                    type: string
                  tls:
                    description: tls configures certificate issuance for this Portal's
                      Ingress.
                    properties:
                      clusterIssuer:
                        description: clusterIssuer is the cert-manager ClusterIssuer
                          name.
                        type: string
                    type: object
                type: object
              userAuthenticationRef:
                description: userAuthenticationRef references the OIDC configuration
                  gating this Portal.
                properties:
                  name:
                    description: name of the referenced object.
                    type: string
                  namespace:
                    default: ""
                    description: |-
                      namespace of the referenced object. Defaults to the referencing object's
                      own namespace when omitted. Explicit default (rather than merely
                      x-kubernetes-list-map-key on status back-ref lists (Decision 5), which
                      the Kubernetes API server requires to have a default or be required.
                    type: string
                required:
                - name
                type: object
            required:
            - host
            - userAuthenticationRef
            type: object
          status:
            description: status defines the observed state of Portal
            properties:
              appRegistrations:
                description: appRegistrations lists the AppRegistrations currently
                  bound to this Portal.
                items:
                  description: |-
                    NamespacedObjectReference identifies another object by name and, optionally,
                    namespace. When Namespace is empty, it defaults to the referencing object's
                    own namespace (see docs/ARCHITECTURE.md Decision 2). Also used for back-ref
                    status lists (Decision 5), where Namespace is always populated.
                  properties:
                    name:
                      description: name of the referenced object.
                      type: string
                    namespace:
                      default: ""
                      description: |-
                        namespace of the referenced object. Defaults to the referencing object's
                        own namespace when omitted. Explicit default (rather than merely
                        x-kubernetes-list-map-key on status back-ref lists (Decision 5), which
                        the Kubernetes API server requires to have a default or be required.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                - namespace
                x-kubernetes-list-type: map
              conditions:
                description: conditions represent the current state of the Portal
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
