# This rule is not used by the project panoptikum itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the panoptikum.panoptikum.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: panoptikum
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: appregistration-editor-role
rules:
- apiGroups:
  - panoptikum.panoptikum.dev
  resources:
  - appregistrations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - panoptikum.panoptikum.dev
  resources:
  - appregistrations/status
  verbs:
  - get
