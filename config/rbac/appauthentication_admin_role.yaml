# This rule is not used by the project panoptikum itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over panoptikum.panoptikum.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: panoptikum
    app.kubernetes.io/managed-by: kustomize
  name: appauthentication-admin-role
rules:
- apiGroups:
  - panoptikum.panoptikum.dev
  resources:
  - appauthentications
  verbs:
  - '*'
- apiGroups:
  - panoptikum.panoptikum.dev
  resources:
  - appauthentications/status
  verbs:
  - get
