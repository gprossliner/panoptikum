apiVersion: panoptikum.panoptikum.dev/v1alpha1
kind: AppRegistration
metadata:
  labels:
    app.kubernetes.io/name: panoptikum
    app.kubernetes.io/managed-by: kustomize
  name: appregistration-sample
spec:
  portalRef:
    name: portal-sample
  appAuthenticationRef:
    name: appauthentication-sample
  displayName: Sample App
  routing:
    pathPrefix: /sample/
  routes:
    # Example (issue #11): allow anonymous access to a backend's own public
    # routes (e.g. Grafana's "Share externally" dashboards - the page itself
    # at /public-dashboards/ and the API it calls at /api/public-dashboards/).
    # Adjust the patterns to the app's actual public paths, or remove this
    # whole list entirely for "everything requires login" (the default).
    - match: ^/public-dashboards/
      access: Anonymous
    - match: ^/api/public-dashboards/
      access: Anonymous
  sortOrder: 10
  backend:
    service:
      # the "kubernetes" Service always exists in any cluster, used here
      # purely so ResolvedRefs/the merged config resolve without deploying
      # an extra sample workload
      name: kubernetes
      namespace: default
      port: 443
