apiVersion: panoptikum.panoptikum.dev/v1alpha1
kind: AppRegistration
metadata:
  labels:
    app.kubernetes.io/name: panoptikum
    app.kubernetes.io/managed-by: kustomize
  name: appregistration-sample
spec:
  portalRef:
    name: portal-sample
  appAuthenticationRef:
    name: appauthentication-sample
  displayName: Sample App
  routing:
    pathPrefix: /sample/
  routes:
    # Example (issue #11, verified against a real Grafana (grafana/grafana-oss:13.0.2) in
    # test/smoke-test/): allow anonymous access to a backend's own public
    # routes - Grafana's Snapshot feature (Dashboard > Share > Snapshot) is
    # explicitly documented as publicly viewable without login: the page
    # itself, the API that fetches the snapshot's data, and the static
    # JS/CSS assets needed to render it. Adjust the patterns to the app's
    # actual public paths, or remove this whole list entirely for
    # "everything requires login" (the default).
    - match: ^/public/
      access: Anonymous
    - match: ^/dashboard/snapshot/
      access: Anonymous
    - match: ^/api/snapshots/
      access: Anonymous
  sortOrder: 10
  backend:
    service:
      # the "kubernetes" Service always exists in any cluster, used here
      # purely so ResolvedRefs/the merged config resolve without deploying
      # an extra sample workload
      name: kubernetes
      namespace: default
      port: 443
