apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "panoptikum.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - panoptikum.panoptikum.dev
  resources:
  - appauthentications
  - appregistrations
  - portals
  - userauthentications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - panoptikum.panoptikum.dev
  resources:
  - appauthentications/finalizers
  - appregistrations/finalizers
  - portals/finalizers
  - userauthentications/finalizers
  verbs:
  - update
- apiGroups:
  - panoptikum.panoptikum.dev
  resources:
  - appauthentications/status
  - appregistrations/status
  - portals/status
  - userauthentications/status
  verbs:
  - get
  - patch
  - update
