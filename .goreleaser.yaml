version: 2

project_name: panoptikum

# Native cross-compilation (GOOS/GOARCH, no QEMU) replaced the previous
# approach of letting `docker buildx build --platform=...` run `go build`
# itself under emulation in the main Dockerfile - that was taking 10+
# minutes per arch. GoReleaser builds both binaries for each arch here,
# then `dockers_v2` below packages them with Dockerfile.release
# (COPY-only, no RUN, so buildx needs no emulation for that part either)
# and builds+pushes the multi-arch manifest in one step; `docker_signs`
# signs it. The main Dockerfile is kept as-is for local/smoke-test/e2e
# builds (`make docker-build`/`docker-buildx`), which still build from
# source.
builds:
  - id: operator
    main: ./cmd/operator
    binary: operator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  - id: server
    main: ./cmd/server
    binary: server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

dockers_v2:
  - ids: [operator, server]
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/gprossliner/panoptikum
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--provenance=true"

docker_signs:
  - artifacts: all
    # Keyless: default args include --key=cosign.key, which we don't use.
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^Merge '

release:
  github:
    owner: gprossliner
    name: panoptikum
  header: |
    Image: `ghcr.io/gprossliner/panoptikum:{{ .Tag }}` (linux/amd64, linux/arm64)

    Helm chart: `oci://ghcr.io/gprossliner/charts/panoptikum` version `{{ .Version }}`

    ```sh
    helm install panoptikum oci://ghcr.io/gprossliner/charts/panoptikum --version {{ .Version }}
    ```

    Both are signed keylessly with [cosign](https://github.com/sigstore/cosign); the image also includes an SBOM attestation. Verify with:

    ```sh
    cosign verify ghcr.io/gprossliner/panoptikum:{{ .Tag }} \
      --certificate-identity-regexp '^https://github\.com/gprossliner/panoptikum/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com

    cosign verify ghcr.io/gprossliner/charts/panoptikum:{{ .Version }} \
      --certificate-identity-regexp '^https://github\.com/gprossliner/panoptikum/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
  extra_files:
    - glob: release-assets/install.yaml
