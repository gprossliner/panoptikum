version: 2

project_name: panoptikum

# The release image (ghcr.io/gprossliner/panoptikum, linux/amd64+linux/arm64,
# cosign-signed, SBOM-attested) is built/pushed/signed directly in
# .github/workflows/release.yml via docker buildx + cosign - NOT through
# GoReleaser's own dockers/docker_signs/sboms pipes. Those pipes only
# operate on artifacts GoReleaser itself builds (see docs: "Container
# images generated by GoReleaser are not available to be cataloged by the
# SBOM tool"), and our Dockerfile builds via `go build` inside Docker
# rather than from a GoReleaser-produced binary. GoReleaser here only
# handles the version, changelog, and GitHub Release.
builds:
  - skip: true

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^Merge '

release:
  github:
    owner: gprossliner
    name: panoptikum
  header: |
    Image: `ghcr.io/gprossliner/panoptikum:{{ .Tag }}` (linux/amd64, linux/arm64)

    Signed keylessly with [cosign](https://github.com/sigstore/cosign) and includes an SBOM attestation. Verify with:

    ```sh
    cosign verify ghcr.io/gprossliner/panoptikum:{{ .Tag }} \
      --certificate-identity-regexp '^https://github\.com/gprossliner/panoptikum/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
  extra_files:
    - glob: dist/install.yaml
