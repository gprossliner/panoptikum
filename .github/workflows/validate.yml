name: Validate

on:
  push:
  pull_request:

permissions: {}

jobs:
  # Warms the Go module cache once so lint/test/test-e2e (which all share
  # the same go.sum-keyed actions/setup-go cache) don't race each other
  # for an empty cache on the same push and each redownload modules.
  setup:
    permissions:
      contents: read
    name: Warm Go module cache
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

  lint:
    needs: setup
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The Makefile's go-install-tool helper skips reinstalling a tool
      # (golangci-lint, including its custom-plugin build - see
      # .custom-gcl.yml) when the exact pinned-version binary under bin/
      # already exists, so caching bin/ avoids a slow `go install` +
      # plugin rebuild (golangci-lint's own separate dependency graph -
      # not covered by actions/setup-go's go.sum-keyed cache above) on
      # every run. controller-gen/setup-envtest don't need this anymore -
      # they're go.mod tool dependencies now, already covered by go.sum.
      #
      # Keyed only on .custom-gcl.yml (pinned version + plugin list),
      # NOT the whole Makefile - unrelated Makefile edits (e.g. to other
      # targets) would otherwise invalidate this cache for no reason.
      - name: Cache golangci-lint binary (incl. custom plugin build)
        uses: actions/cache@v4
        with:
          path: bin
          key: golangci-lint-bin-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml') }}

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test:
    needs: setup
    permissions:
      contents: read
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # setup-envtest is a go.mod tool dependency (see go.mod's `tool`
      # block), so its own deps are already covered by the go.sum-keyed
      # cache above. Its downloaded K8s API server/etcd/kubectl binaries
      # are NOT part of go.sum though (fetched separately, not via `go
      # install`), so that still needs its own cache. controller-gen
      # isn't needed here at all - `make test-ci` skips
      # manifests/generate (see Makefile comment).
      - name: Cache envtest K8s binaries
        uses: actions/cache@v4
        with:
          path: bin/k8s
          key: envtest-k8s-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: Running Tests
        run: |
          go mod tidy
          make test-ci
