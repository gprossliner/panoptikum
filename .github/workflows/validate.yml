name: Validate

on:
  push:
  pull_request:

permissions: {}

jobs:
  # Warms the Go module cache once so lint/test/test-e2e (which all share
  # the same go.sum-keyed actions/setup-go cache) don't race each other
  # for an empty cache on the same push and each redownload modules.
  setup:
    permissions:
      contents: read
    name: Warm Go module cache
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

  lint:
    needs: setup
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # actions/setup-go above already caches $GOMODCACHE/$GOCACHE; this
      # additionally caches golangci-lint's own incremental analysis
      # cache, which isn't covered by that.
      - name: Cache golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test:
    needs: setup
    permissions:
      contents: read
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
