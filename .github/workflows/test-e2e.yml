name: E2E Tests

# Manual-only (not on every push/PR): starts a real kind cluster and
# builds the full operator/server image, much slower than lint/test (see
# docs/ARCHITECTURE.md / repo history for baseline timings). Run from the
# Actions tab, or `gh workflow run test-e2e.yml`, when you specifically
# want to validate the envtest-adjacent e2e suite (test/e2e/).
on:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
