name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/gprossliner/panoptikum

jobs:
  # Gates the release job on the tagged commit (not the tag-push event's own
  # redundant Verify run, which may still be in flight) having an earlier
  # successful Verify run - e.g. from when it was pushed/merged to main.
  check-verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify tagged commit passed Verify workflow
        uses: actions/github-script@v9
        env:
          TAG_COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagCommitSha = process.env.TAG_COMMIT_SHA;

            core.info(`Release tag ${context.ref} resolves to commit ${tagCommitSha}`);

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'verify.yml',
              event: 'push',
              per_page: 100
            });

            const matchingRun = runs.data.workflow_runs.find(run =>
              run.head_sha === tagCommitSha
              && run.status === 'completed'
              && run.conclusion === 'success'
            );

            if (!matchingRun) {
              core.setFailed(
                `No successful Verify run found for commit ${tagCommitSha}. ` +
                `Release aborted for tag ${context.ref}.`
              );
              return;
            }

            core.info(`Verified by run: ${matchingRun.html_url}`);

  release:
    needs: check-verify
    permissions:
      contents: write  # create the GitHub Release
      packages: write  # push to ghcr.io
      id-token: write  # cosign keyless signing (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed for the changelog
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # `make build-installer` runs `kustomize edit set image`, which
      # edits the tracked config/manager/kustomization.yaml in place -
      # restore it so GoReleaser's git-dirty check doesn't fail. Also
      # copy the output out of dist/ - GoReleaser refuses to run unless
      # dist/ is empty or --clean is passed, and --clean wipes dist/
      # (deleting install.yaml) before the release step uploads it.
      - name: Render install manifest
        run: |
          make build-installer IMG=${{ env.IMAGE }}:${{ github.ref_name }}
          git checkout -- config/manager/kustomization.yaml
          mkdir -p release-assets
          cp dist/install.yaml release-assets/install.yaml

      # Builds operator/server natively per-arch (no QEMU), then builds,
      # pushes, and signs the multi-arch image via the dockers_v2/
      # docker_signs pipes in .goreleaser.yaml. --clean is required:
      # GoReleaser refuses to run if dist/ (populated just above) isn't
      # empty, and this also wipes dist/ - which is why install.yaml was
      # copied to release-assets/ instead.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-and-push-chart:
    # Depends on `release` (not just `check-verify`) so a chart is never
    # pushed unless its matching runtime image push already succeeded.
    needs: [check-verify, release]
    permissions:
      contents: read
      packages: write  # push to ghcr.io
      id-token: write  # cosign keyless signing (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # Helm's OCI client reads the same credential store as docker
      # (~/.docker/config.json) - this is a separate job/runner from
      # `release` above though, so its login doesn't carry over here.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chart.yaml keeps a committed 0.0.0 placeholder, never rewritten -
      # --version overrides it for this package only. Also pin the
      # manager image repository/tag that ships as the chart's default,
      # since Chart.yaml has no appVersion for manager.yaml's
      # `.Values.manager.image.tag | default .Chart.AppVersion` to fall
      # back to - without this, a plain `helm install` would resolve an
      # empty image tag.
      - name: Package chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          yq -i '.manager.image.repository = env(IMAGE) | .manager.image.tag = env(VERSION)' charts/chart/values.yaml
          mkdir -p /tmp/chart-out
          helm package charts/chart --version "${VERSION#v}" --destination /tmp/chart-out

      - name: Push chart
        env:
          VERSION: ${{ github.ref_name }}
        run: helm push "/tmp/chart-out/panoptikum-${VERSION#v}.tgz" "oci://ghcr.io/gprossliner/charts"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless, same as the image above - appended to the registry
      # alongside the chart, verifiable via `cosign verify`.
      - name: Sign chart (cosign keyless)
        env:
          VERSION: ${{ github.ref_name }}
        run: cosign sign --yes "ghcr.io/gprossliner/charts/panoptikum:${VERSION#v}"
